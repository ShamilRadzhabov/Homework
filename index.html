<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="registration-container">
      <button class="btn-registration btn-show-modal" type="button">Регистрация</button>
      <button class="btn-login btn-show-modal" type="button">Вход</button>
    </div>
    <h1 class="main-title">Выбери свой продукт</h1>
    <div class="background"></div>
      <ul class="product-wrapper">
        <button id="change-color-all-cards">Сменить цвет всех карточек</button>
        <button id="change-color-first-card">Сменить цвет первой карточки</button>
        <button id="open-google">Открыть страницу Google.com</button>
        <button class="bg-aqua">Изменение цвета кнопки</button>
        <ul class="product-list list-none"></ul>
        <template id="product-card-template">
          <li class="product-card">
            <img class="product-img" alt="img" width="290" height="245">
            <span class="product-category"></span>
            <h3 class="prouct-title"></h3>
            <p class="product-description"></p>
            <span class="product-card-compound">Состав:</span>
            <ul class="product-compound">
              <li class="product-compound-iteam"></li>
            </ul>
            <div class="product-price-container">
              <span class="product-price-label">Цена</span>
              <span class="product-price"></span>
            </div>
          </li>
        </template>
      </ul>
      <footer class="basement">
        <div class="footer-offers-container">
          <h2 class="footer-title">Product Cards</h2>
          <span class="footer-offers-text">У Нас Самые Лучшие Продукты Для Кожи!</span>
          <div class="footer-icon-containe">
            <img class="footer-icon-tg" src="/images/telegram.png" alt="telegram">
            <img class="footer-icon-vk" src="/images/vk.png" alt="vk">
          </div>
        </div>
        <div class="footer-email-container">
          <span class="footer-email-subscribe-text">Подпишись на наши акции:</span>
          <form class="footer-email-form-container">
            <input class="footer-email-input" name="email" placeholder="Введи Email">
             <div class="footer-email-input-line"></div>
            <button class="footer-email-btn-subscribe" type="submit">Подписаться</button>
          </form>
          <div class="footer-email-bottom-line"></div>
          <span class="footer-email-address-text">www.product-cards.com&copy;all right reserve</span>
        </div>
        <nav class="footer-nav-container">
          <div class="footer-nav-link-container">
            <span class="footer-nav-title">Быстрые ссылки</span>
            <a class="footer-nav-link" href="#">Главная</a>
            <a class="footer-nav-link" href="#">Магазин</a>
            <a class="footer-nav-link" href="#">Контакты</a>
          </div>
        </nav>
      </footer>
      <div class="modal modal-reg">
        <form class="form-reg form">
          <button class="modal-reg-close-button close-button" type="button"></button>
          <label>
            <span class="form-label form-name">Имя</span>
            <input type="text" required name="firstname" placeholder="Имя" class="form-input">
          </label>
          <label>
            <span class="form-label form-reg-">Фамилия</span>
            <input type="text" required name="surname" placeholder="Фамилия" class="form-input" id="form-input-surname">
          </label>
          <label>
            <span class="form-label">Дата рождения</span>
            <input type="date" required name="birthday" placeholder="Дата рождения" class="form-input" id="form-input-date">
          </label>
          <label>
            <span class="form-label ">Логин</span>
            <input type="email" required name="email" placeholder="Ваш email" class="form-input" id="form-input-email">
            <span class="error-email"></span>
          </label>
          <label>
            <span class="form-label">Пароль</span>
            <input type="password" required name="password" placeholder="Пароль" class="form-input" id="form-input-password">
            <span class="error-password"></span>
          </label>
          <label>
            <span class="form-label">Пароль (еще раз)</span>
            <input type="password" required name="passwordrepeat" placeholder="Пароль" class="form-input" id="form-input-passwordrepeat">
            <span class="error-passwordrepeat"></span>
            <span class="error-text"></span>
          </label>
          <button class="reg-enter-button enter-btn" type="button">Отправить</button>
        </form>
      </div>
      <div class="modal modal-login">
        <form class="form-login form">
          <button class="modal-login-close-button close-button" type="button">X</button>
          <label>
            <span class="form-label">Логин</span>
            <input type="email" name="email" placeholder="Ваш email" class="form-input">
          </label>
          <label>
            <span class="form-label">Пароль</span>
            <input type="password" name="password" placeholder="Пароль" class="form-input">
          </label>
          <span class="login-error-text"></span>
          <button class="login-enter-button enter-btn" type="button">Войти</button>
        </form>
      </div>
      <script src="main.js"></script>
      <script src="homework-5.js"></script>
      <script src="homework-6.js"></script>
      <script src="homework-7.js" type="module"></script>
      <script src="homework-8.js" type="module"></script>
      <script src="homework-9.js" type="module"></script>
  </div>
</body>
</html>
