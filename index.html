<!DOCTYPE html>
< lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1 class="main-title">Выбери свой продукт</h1>
    <div class="background"></div>
      <ul class="product-wrapper">
        <button id="change-color-all-cards">Сменить цвет всех карточек</button>
        <button id="change-color-first-card">Сменить цвет первой карточки</button>
        <button id="open-google">Открыть страницу Google.com</button>
        <button class="bg-aqua">Изменение цвета кнопки</button>
        <ul class="product-list list-none">
        </ul>
        <template id="product-card-template">
          <li class="product-card">
            <img id="img" alt="Увлажняющий мусс" width="290" height="245">
            <span class="product-category">для нормальной кожи</span>
            <h3 id="title" class="prouct-name"></h3>
            <p id="description"class="product-description"></p>
            <span class="product-card-compound">Состав:</span>
            <ul class="product-compound">
              <li id="compound-element-one" class="product-compound-iteam"></li>
              <li id="compound-element-two" class="product-compound-iteam"></li>
              <li id="compound-element-three" class="product-compound-iteam"></li>              
            </ul>
            <div class="product-price-container">
              <span class="product-price-label">Цена</span>
              <span id="price" class="product-price"></span>
            </div>
          </li>
        </template>
        </li>
      </ul>
      <script src="main.js"></script>
      <script src="homework-5.js"></script>
      <script src="homework-6.js"></script>
      <script src="homework-7.js" type="module"></script>
      <script src="homework-8.js" type="module"></script>
  </div>
</body>
</html>
